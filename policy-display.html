<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Policy</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    .wrap {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 0;
      margin: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .policy-sheet {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      max-width: 100%;
      max-height: 100%;
    }
    @media print {
      html, body { overflow: visible; }
      .wrap { overflow: visible; height: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img
      class="policy-sheet"
      src=""
      alt="Hotel Policy and Amenities"
    />
  </div>

  <script type="module" src="/src/policy-display/main.ts"></script>
</body>
</html>
